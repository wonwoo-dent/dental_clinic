<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- 그림 공통: 평면 도형, 한 가지 선 굵기, 페이지 색만 사용 -->

  <!-- 치식표 (FDI 번호 치아 기록표) -->
  <symbol id="d-chart" viewBox="0 0 600 760">
    <rect x="0" y="0" width="600" height="760" fill="var(--field-deep)"/>
    <rect x="48" y="56" width="504" height="648" fill="var(--paper)"/>
    <!-- 집게 -->
    <rect x="250" y="28" width="100" height="44" fill="var(--ink)"/>
    <rect x="274" y="40" width="52" height="16" fill="var(--paper)"/>
    <text x="80" y="118" font-size="34" font-weight="700" fill="var(--ink)">치식표</text>
    <text x="80" y="150" font-size="18" fill="var(--muted)">3사단 의무대대 치과 · 진료 기록</text>
    <!-- 잇몸 띠 -->
    <rect x="80" y="286" width="440" height="20" fill="var(--field-light)"/>
    <rect x="80" y="420" width="440" height="20" fill="var(--field-light)"/>
    <!-- 위턱: 18 17 16 15 14 13 12 11 | 21 22 23 24 25 26 27 28 -->
    <g fill="var(--surface-deep)">
      <rect x="82" y="212" width="24" height="68" rx="6"/>
      <rect x="110" y="212" width="24" height="68" rx="6"/>
      <rect x="138" y="212" width="24" height="68" rx="6"/>
      <rect x="166" y="222" width="20" height="58" rx="6"/>
      <rect x="190" y="222" width="20" height="58" rx="6"/>
      <rect x="214" y="206" width="20" height="74" rx="6"/>
      <rect x="238" y="226" width="18" height="54" rx="6"/>
      <rect x="260" y="222" width="20" height="58" rx="6"/>
      <rect x="320" y="222" width="20" height="58" rx="6"/>
      <rect x="344" y="226" width="18" height="54" rx="6"/>
      <rect x="366" y="206" width="20" height="74" rx="6"/>
      <rect x="390" y="222" width="20" height="58" rx="6"/>
      <rect x="414" y="222" width="20" height="58" rx="6"/>
      <rect x="438" y="212" width="24" height="68" rx="6"/>
      <rect x="466" y="212" width="24" height="68" rx="6"/>
      <rect x="494" y="212" width="24" height="68" rx="6"/>
    </g>
    <!-- 아래턱 -->
    <g fill="var(--surface-deep)">
      <rect x="82" y="446" width="24" height="68" rx="6"/>
      <rect x="110" y="446" width="24" height="68" rx="6"/>
      <rect x="138" y="446" width="24" height="68" rx="6"/>
      <rect x="166" y="446" width="20" height="58" rx="6"/>
      <rect x="190" y="446" width="20" height="58" rx="6"/>
      <rect x="214" y="446" width="20" height="74" rx="6"/>
      <rect x="238" y="446" width="18" height="54" rx="6"/>
      <rect x="260" y="446" width="20" height="54" rx="6"/>
      <rect x="320" y="446" width="20" height="54" rx="6"/>
      <rect x="344" y="446" width="18" height="54" rx="6"/>
      <rect x="366" y="446" width="20" height="74" rx="6"/>
      <rect x="390" y="446" width="20" height="58" rx="6"/>
      <rect x="414" y="446" width="20" height="58" rx="6"/>
      <rect x="438" y="446" width="24" height="68" rx="6"/>
      <rect x="466" y="446" width="24" height="68" rx="6"/>
      <rect x="494" y="446" width="24" height="68" rx="6"/>
    </g>
    <!-- 충치 치료 자리: 큰어금니 16, 26, 36, 46 -->
    <g fill="var(--field)">
      <rect x="138" y="212" width="24" height="68" rx="6"/>
      <rect x="438" y="212" width="24" height="68" rx="6"/>
      <rect x="138" y="446" width="24" height="68" rx="6"/>
      <rect x="438" y="446" width="24" height="68" rx="6"/>
    </g>
    <!-- 사랑니: 18, 28, 38, 48 -->
    <g fill="var(--ink)">
      <rect x="82" y="212" width="24" height="68" rx="6"/>
      <rect x="494" y="212" width="24" height="68" rx="6"/>
      <rect x="82" y="446" width="24" height="68" rx="6"/>
      <rect x="494" y="446" width="24" height="68" rx="6"/>
    </g>
    <!-- 정중선 -->
    <rect x="296" y="200" width="8" height="330" fill="var(--field-light)"/>
    <g font-size="15" fill="var(--muted)" text-anchor="middle">
      <text x="94" y="200">18</text><text x="122" y="200">17</text><text x="150" y="200">16</text><text x="176" y="200">15</text><text x="200" y="200">14</text><text x="224" y="200">13</text><text x="247" y="200">12</text><text x="270" y="200">11</text>
      <text x="330" y="200">21</text><text x="353" y="200">22</text><text x="376" y="200">23</text><text x="400" y="200">24</text><text x="424" y="200">25</text><text x="450" y="200">26</text><text x="478" y="200">27</text><text x="506" y="200">28</text>
      <text x="94" y="545">48</text><text x="122" y="545">47</text><text x="150" y="545">46</text><text x="176" y="545">45</text><text x="200" y="545">44</text><text x="224" y="545">43</text><text x="247" y="545">42</text><text x="270" y="545">41</text>
      <text x="330" y="545">31</text><text x="353" y="545">32</text><text x="376" y="545">33</text><text x="400" y="545">34</text><text x="424" y="545">35</text><text x="450" y="545">36</text><text x="478" y="545">37</text><text x="506" y="545">38</text>
    </g>
    <!-- 범례 -->
    <rect x="80" y="596" width="22" height="22" fill="var(--field)"/>
    <text x="114" y="614" font-size="18" fill="var(--ink)">충치 치료가 잦은 큰어금니</text>
    <rect x="80" y="630" width="22" height="22" fill="var(--ink)"/>
    <text x="114" y="648" font-size="18" fill="var(--ink)">사랑니 (발치 상담)</text>
    <rect x="80" y="664" width="22" height="22" fill="var(--field-light)"/>
    <text x="114" y="682" font-size="18" fill="var(--ink)">잇몸선 (스케일링 · 잇몸 치료)</text>
  </symbol>

  <!-- 주간 진료 시간표 -->
  <symbol id="d-week" viewBox="0 0 600 760">
    <rect x="0" y="0" width="600" height="760" fill="var(--field-deep)"/>
    <rect x="48" y="56" width="504" height="648" fill="var(--paper)"/>
    <circle cx="80" cy="84" r="7" fill="var(--ink)"/>
    <circle cx="520" cy="84" r="7" fill="var(--ink)"/>
    <text x="80" y="134" font-size="34" font-weight="700" fill="var(--ink)">주간 진료 시간표</text>
    <text x="80" y="166" font-size="18" fill="var(--muted)">평일 09:00–16:00 · 점심 12:00–13:00</text>
    <!-- 요일 머리 -->
    <g font-size="18" font-weight="500" fill="var(--ink)" text-anchor="middle">
      <text x="190" y="214">월</text><text x="250" y="214">화</text><text x="310" y="214">수</text><text x="370" y="214">목</text><text x="430" y="214">금</text>
      <text x="490" y="214" fill="var(--muted)">토·일</text>
    </g>
    <!-- 시간 라벨 -->
    <g font-size="16" fill="var(--muted)" text-anchor="end">
      <text x="150" y="246">9</text><text x="150" y="290">10</text><text x="150" y="334">11</text><text x="150" y="378">12</text><text x="150" y="422">13</text><text x="150" y="466">14</text><text x="150" y="510">15</text><text x="150" y="554">16</text><text x="150" y="598">17</text>
    </g>
    <!-- 요일 열: 오전 09–12, 점심, 오후 13–17 -->
    <g fill="var(--field)">
      <rect x="166" y="230" width="48" height="128"/><rect x="166" y="406" width="48" height="132"/>
      <rect x="226" y="230" width="48" height="128"/><rect x="226" y="406" width="48" height="132"/>
      <rect x="286" y="230" width="48" height="128"/><rect x="286" y="406" width="48" height="132"/>
      <rect x="346" y="230" width="48" height="128"/><rect x="346" y="406" width="48" height="132"/>
      <rect x="406" y="230" width="48" height="128"/><rect x="406" y="406" width="48" height="132"/>
    </g>
    <g fill="var(--field-light)">
      <rect x="166" y="362" width="48" height="40"/><rect x="226" y="362" width="48" height="40"/><rect x="286" y="362" width="48" height="40"/><rect x="346" y="362" width="48" height="40"/><rect x="406" y="362" width="48" height="40"/>
    </g>
    <rect x="466" y="230" width="48" height="308" fill="var(--surface-deep)"/>
    <text x="490" y="392" font-size="16" fill="var(--muted)" text-anchor="middle">휴진</text>
    <text x="290" y="388" font-size="14" fill="var(--ink)" text-anchor="middle">점심</text>
    <!-- 비고 -->
    <rect x="80" y="620" width="22" height="22" fill="var(--field)"/>
    <text x="114" y="638" font-size="17" fill="var(--ink)">진료</text>
    <rect x="200" y="620" width="22" height="22" fill="var(--field-light)"/>
    <text x="234" y="638" font-size="17" fill="var(--ink)">점심시간</text>
    <text x="80" y="676" font-size="16" fill="var(--muted)">훈련 · 행사 기간에는 진료 시간이 바뀔 수 있습니다</text>
  </symbol>

  <!-- 진료 의뢰서 -->
  <symbol id="d-form" viewBox="0 0 600 760">
    <rect x="0" y="0" width="600" height="760" fill="var(--field-deep)"/>
    <rect x="40" y="40" width="520" height="690" fill="var(--ink)"/>
    <rect x="64" y="84" width="472" height="620" fill="var(--paper)"/>
    <rect x="240" y="24" width="120" height="56" fill="var(--field)"/>
    <rect x="270" y="40" width="60" height="18" fill="var(--paper)"/>
    <text x="96" y="150" font-size="34" font-weight="700" fill="var(--ink)">진료 의뢰서</text>
    <text x="96" y="182" font-size="17" fill="var(--muted)">소속 부대 의무실 → 의무대대 치과</text>
    <g font-size="16" fill="var(--muted)">
      <text x="96" y="236">소속</text>
      <text x="96" y="300">계급 · 성명</text>
      <text x="96" y="364">군번</text>
      <text x="96" y="428">증상</text>
      <text x="96" y="540">의뢰 의무실</text>
    </g>
    <g fill="var(--surface-deep)">
      <rect x="96" y="246" width="380" height="30"/>
      <rect x="96" y="310" width="300" height="30"/>
      <rect x="96" y="374" width="240" height="30"/>
      <rect x="96" y="438" width="408" height="30"/>
      <rect x="96" y="476" width="340" height="30"/>
      <rect x="96" y="550" width="220" height="30"/>
    </g>
    <g fill="var(--field)">
      <rect x="96" y="246" width="190" height="30"/>
      <rect x="96" y="438" width="260" height="30"/>
    </g>
    <!-- 긴급 여부 체크 -->
    <rect x="96" y="604" width="22" height="22" fill="var(--surface-deep)"/>
    <text x="128" y="622" font-size="17" fill="var(--ink)">일반</text>
    <rect x="196" y="604" width="22" height="22" fill="var(--field)"/>
    <text x="228" y="622" font-size="17" fill="var(--ink)">응급 (치통 · 외상)</text>
    <!-- 직인 -->
    <circle cx="456" cy="600" r="40" fill="none" stroke="var(--field)" stroke-width="4"/>
    <text x="456" y="606" font-size="16" font-weight="700" fill="var(--field)" text-anchor="middle">의무실</text>
    <text x="96" y="676" font-size="15" fill="var(--muted)">군 신분증과 함께 지참</text>
  </symbol>

  <!-- 진료실: 유닛 체어 (왼쪽), 오른쪽 벽은 비워 글이 앉는다 -->
  <symbol id="d-room" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <rect x="0" y="0" width="1600" height="900" fill="var(--field)"/>
    <rect x="0" y="640" width="1600" height="260" fill="var(--field-deep)"/>
    <rect x="0" y="628" width="1600" height="12" fill="var(--ink)"/>
    <!-- 창 -->
    <rect x="360" y="100" width="300" height="240" fill="var(--field-light)"/>
    <rect x="504" y="100" width="12" height="240" fill="var(--field)"/>
    <rect x="360" y="216" width="300" height="12" fill="var(--field)"/>
    <!-- 수납장 -->
    <rect x="40" y="420" width="260" height="220" fill="var(--field-deep)"/>
    <rect x="60" y="440" width="100" height="90" fill="var(--field-light)"/>
    <rect x="180" y="440" width="100" height="90" fill="var(--field-light)"/>
    <rect x="60" y="550" width="220" height="70" fill="var(--ink)"/>
    <rect x="160" y="580" width="20" height="8" fill="var(--paper)"/>
    <rect x="70" y="400" width="60" height="20" fill="var(--paper)"/>
    <rect x="140" y="392" width="40" height="28" fill="var(--paper)"/>
    <!-- 안내 표지: 오른쪽 위, 글이 앉는 아래쪽 삼분의 일을 피한다 -->
    <rect x="1240" y="90" width="160" height="60" fill="var(--paper)"/>
    <text x="1320" y="132" font-size="30" font-weight="700" fill="var(--ink)" text-anchor="middle">치과</text>
    <!-- 조명 팔과 램프 -->
    <rect x="690" y="0" width="16" height="200" fill="var(--ink)"/>
    <rect x="560" y="196" width="146" height="14" fill="var(--ink)"/>
    <rect x="500" y="200" width="100" height="60" rx="8" fill="var(--paper)"/>
    <rect x="510" y="246" width="80" height="14" fill="var(--field-light)"/>
    <!-- 체어: 받침, 기둥, 좌석, 등받이, 머리받침, 팔걸이 -->
    <rect x="440" y="600" width="260" height="30" fill="var(--ink)"/>
    <rect x="540" y="500" width="60" height="110" fill="var(--ink)"/>
    <rect x="380" y="460" width="420" height="60" rx="16" fill="var(--paper)"/>
    <rect x="380" y="500" width="420" height="22" fill="var(--surface-deep)"/>
    <rect x="300" y="470" width="110" height="70" rx="16" fill="var(--paper)"/>
    <rect x="300" y="520" width="110" height="20" fill="var(--surface-deep)"/>
    <rect x="720" y="300" width="80" height="200" rx="16" fill="var(--paper)"/>
    <rect x="720" y="300" width="22" height="200" fill="var(--surface-deep)"/>
    <rect x="712" y="250" width="92" height="56" rx="14" fill="var(--paper)"/>
    <rect x="560" y="420" width="120" height="30" rx="8" fill="var(--surface-deep)"/>
    <!-- 타구대와 기구 트레이 -->
    <rect x="880" y="380" width="24" height="230" fill="var(--ink)"/>
    <rect x="840" y="370" width="110" height="40" rx="8" fill="var(--paper)"/>
    <circle cx="896" cy="390" r="12" fill="var(--field-light)"/>
    <rect x="830" y="300" width="130" height="30" rx="6" fill="var(--paper)"/>
    <rect x="846" y="282" width="50" height="8" fill="var(--field)"/>
    <rect x="906" y="282" width="30" height="8" fill="var(--field)"/>
    <!-- 바닥 선 -->
    <rect x="0" y="760" width="1600" height="14" fill="var(--ink)"/>
  </symbol>

  <!-- 진료 과목 그림 3개 (3:4) -->
  <symbol id="d-cavity" viewBox="0 0 300 400">
    <rect x="0" y="0" width="300" height="400" fill="var(--field-light)"/>
    <rect x="0" y="250" width="300" height="150" fill="var(--field)"/>
    <!-- 어금니: 치관과 뿌리 -->
    <path d="M70 120 q10-50 50-50 q30 0 40 20 q10-20 40-20 q40 0 50 50 l0 110 q0 30-40 30 l-100 0 q-40 0-40-30z" fill="var(--paper)"/>
    <path d="M110 260 l-16 90 q-4 20 16 20 l10 0 l14-90z M190 260 l16 90 q4 20-16 20 l-10 0 l-14-90z" fill="var(--paper)"/>
    <path d="M90 120 q8-40 30-40 q20 0 30 16 q10-16 30-16 q22 0 30 40 l0 40 l-120 0z" fill="var(--surface-deep)" opacity="0.5"/>
    <!-- 충치 자리와 메운 부분 -->
    <ellipse cx="150" cy="150" rx="34" ry="20" fill="var(--ink)"/>
    <ellipse cx="150" cy="150" rx="22" ry="12" fill="var(--field)"/>
    <rect x="120" y="178" width="60" height="10" fill="var(--field-deep)"/>
  </symbol>
  <symbol id="d-wisdom" viewBox="0 0 300 400">
    <rect x="0" y="0" width="300" height="400" fill="var(--field-light)"/>
    <rect x="0" y="220" width="300" height="180" fill="var(--field)"/>
    <!-- 바로 선 어금니 -->
    <path d="M40 130 q10-40 40-40 q25 0 35 18 q10-18 35-18 q30 0 40 40 l0 90 q0 26-34 26 l-82 0 q-34 0-34-26z" fill="var(--paper)"/>
    <path d="M70 246 l-12 70 q-2 16 14 16 l8 0 l10-70z M140 246 l12 70 q2 16-14 16 l-8 0 l-10-70z" fill="var(--paper)"/>
    <!-- 기울어진 사랑니, 잇몸 아래 -->
    <g transform="rotate(-38 230 250)">
      <path d="M180 200 q8-36 34-36 q20 0 28 14 q8-14 28-14 q26 0 34 36 l0 70 q0 22-28 22 l-68 0 q-28 0-28-22z" fill="var(--ink)"/>
      <path d="M204 292 l-10 56 q-2 14 12 14 l6 0 l8-56z M262 292 l10 56 q2 14-12 14 l-6 0 l-8-56z" fill="var(--ink)"/>
    </g>
    <rect x="0" y="220" width="300" height="18" fill="var(--field-deep)"/>
  </symbol>
  <symbol id="d-gum" viewBox="0 0 300 400">
    <rect x="0" y="0" width="300" height="400" fill="var(--field-light)"/>
    <rect x="0" y="230" width="300" height="170" fill="var(--field)"/>
    <path d="M80 110 q10-46 48-46 q30 0 44 24 q18-24 48-24 q0 0 0 0 l0 140 q0 30-40 30 l-60 0 q-40 0-40-30z" fill="var(--paper)"/>
    <path d="M110 230 l-14 84 q-3 18 14 18 l12 0 l12-84z" fill="var(--paper)"/>
    <!-- 잇몸선의 치석 -->
    <g fill="var(--ink)">
      <rect x="84" y="214" width="18" height="18" rx="4"/>
      <rect x="106" y="220" width="14" height="12" rx="4"/>
      <rect x="126" y="216" width="12" height="16" rx="4"/>
    </g>
    <!-- 스케일러 -->
    <rect x="192" y="40" width="22" height="200" rx="8" fill="var(--ink)"/>
    <rect x="196" y="60" width="14" height="60" fill="var(--field)"/>
    <path d="M203 240 l-10 30 l10 24 l10-24z" fill="var(--surface-deep)"/>
    <rect x="0" y="230" width="300" height="16" fill="var(--field-deep)"/>
  </symbol>
</svg>
